/* ===== SaaS design layer (overrides only; app logic untouched) ===== */
:root{--hh:64px;--sw:256px;--bg:#f5f7fa;--sf:#fff;--tx:#0f1b2d;--mu:#5a6b80;--bd:#d9e1ec;--ac:#1457b8;--so:#eef4fc;--sh1:0 1px 2px rgba(15,27,45,.05);--sh2:0 8px 24px rgba(15,27,45,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--sf:#111b2e;--tx:#e8eef5;--mu:#9fb0c4;--bd:#24344d;--ac:#7db2ff;--so:#16253d;--sh1:0 1px 2px rgba(0,0,0,.35);--sh2:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1220;--sf:#111b2e;--tx:#e8eef5;--mu:#9fb0c4;--bd:#24344d;--ac:#7db2ff;--so:#16253d;--sh1:0 1px 2px rgba(0,0,0,.35);--sh2:0 8px 24px rgba(0,0,0,.4)}
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
#tt{position:fixed;left:0;top:0}

/* ---- App shell: top bar + left sidebar + content ---- */
.tabs[hidden]{display:none!important}
body,body.lp{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);grid-template-rows:auto 1fr auto;min-height:100dvh}
body.lp{grid-template-rows:auto minmax(0,1fr) auto}
body>header{grid-column:1/-1;grid-row:1}
body>.tabs{grid-column:1;grid-row:2}
body>main{grid-column:2;grid-row:2}
body>footer{grid-column:2;grid-row:3}
body:has(>.tabs[hidden])>main,body:has(>.tabs[hidden])>footer{grid-column:1/-1}
body.lp main{overflow:auto}

/* Top bar */
body>header{height:var(--hh);padding:0 24px;gap:10px;box-shadow:none;border-bottom:1px solid var(--bd);background:var(--sf);flex-wrap:nowrap}
header::before{height:2px}
.lg{padding:0;background:transparent}.lg img{height:40px}
.hm{margin-left:12px;gap:4px}
header .ml,header .um2 .ml.hl{border:0!important;border-radius:8px!important;min-height:36px;padding:7px 14px!important;font-weight:500;color:var(--mu)}
header .ml:hover{background:var(--bg);color:var(--tx)}
header .ml[aria-current=page]{background:var(--so);color:var(--ac);font-weight:600}
header #lo{border:1px solid var(--bd)!important}
.um2{gap:8px}
.who{background:none;padding:0;font-weight:500;color:var(--mu);font-size:13px}
.av{width:34px;height:34px;background:linear-gradient(135deg,var(--ac),#2aa044);color:#fff;border:0;box-shadow:var(--sh1)}

/* Sidebar */
body>.tabs{display:flex;flex-direction:column;background:var(--sf);border-right:1px solid var(--bd);border-bottom:0;box-shadow:none;padding:20px 14px;position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));align-self:start;height:calc(100dvh - var(--hh) - env(safe-area-inset-top,0px));overflow-y:auto}
